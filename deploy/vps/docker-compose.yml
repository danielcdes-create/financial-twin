services:
  financial-twin:
    build: .
    container_name: financial-twin-server
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 128
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/media:/app/data/media
      - ./logs:/app/logs
      - ./apk:/app/apk:ro
