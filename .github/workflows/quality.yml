name: Quality gates
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -q
      - run: pip-audit -r backend/requirements.lock.txt --no-deps --disable-pip
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo install --check
      - run: pnpm exec tsc --noEmit
      - run: node scripts/run-client-tests.cjs
      - run: pnpm exec eslint App.tsx components utils app
      - run: node scripts/audit-dependencies.cjs
      - run: pnpm exec expo export --platform web --output-dir desktop-dist
  integration:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=financialTwinTest
      MONGODB_DATABASE: financial_twin_test_control
      MONGODB_DIRECT_HOSTS: ''
      MEDIA_STORAGE_PATH: /tmp/financial-twin-test-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Start isolated replica set
        run: |
          docker run --detach --name financial-twin-test --publish 127.0.0.1:27017:27017 mongo:8.0 --replSet financialTwinTest --bind_ip_all
          for attempt in $(seq 1 30); do
            docker exec financial-twin-test mongosh --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 1
          done
          docker exec financial-twin-test mongosh --quiet --eval 'rs.initiate({_id:"financialTwinTest",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            docker exec financial-twin-test mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' && break
            sleep 1
          done
      - run: python backend/scripts/check_all.py /tmp/financial-twin-test-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: /tmp/financial-twin-test-evidence
      - run: docker rm --force financial-twin-test
        if: always()
